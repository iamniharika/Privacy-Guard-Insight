<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">PrivacyGuard AI icon</title>
  <desc id="desc">A shield containing protected data rows and a small lock, representing data privacy.</desc>
  <defs>
