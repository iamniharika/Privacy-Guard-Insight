      <rect x="29" y="48" width="6" height="11" rx="3" fill="#0F172A"/>
    </g>
  </g>

  <text x="306" y="153" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif" font-size="75" font-weight="750" letter-spacing="-2.8" fill="#F8FAFC" dominant-baseline="middle">PrivacyGuard AI</text>
  <text x="312" y="218" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" letter-spacing="0.4" fill="#CBD5E1">privacy-first data protection</text>
