<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">PrivacyGuard AI logo</title>
  <desc id="desc">PrivacyGuard AI wordmark with a shield icon representing privacy protection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#10233F"/>
    </linearGradient>
    <linearGradient id="shield" x1="78" y1="52" x2="222" y2="258" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E3A5F"/>
