    <filter id="softShadow" x="40" y="30" width="240" height="260" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="38" fill="url(#bg)"/>

